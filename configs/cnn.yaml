# CNN baseline encoder (371K params, 2.3M FLOPs/sample).
model:
  name: cnn
  params: {}

phase: both  # "1" (train only), "2" (evaluate only, needs evaluation.model_path or --model), or "both"
seed: 0
output_dir: outputs/cnn_ablation

data:
  train_patches_dir: data/TrainPatches
  patches_dir: data/Patches
  tmm100_path: data/eval/tmm100performances.mat
  keyposes_path: data/eval/tmmkeyposes.mat

training:
  epochs: 38
  batch_size: 128
  test_subject: 10        # held out as the phase-1 test set
  optimizer: SGD
  lr: 0.01
  weight_decay: 0.0005
  lr_decay: 1.0            # per-epoch ExponentialLR gamma; 1.0 disables decay
  lr_div_batchsize: true   # baseline recipe divides lr by batch_size
  use_original_hparams: false  # cnn's "original" recipe *is* this baseline recipe
  num_workers: 0
  print_freq: 10

evaluation:
  atlas_subject: 7
  atlas_take: 2
  benchmark_take_count: 5
  model_path: null  # only read when phase is "2" and --model isn't passed
